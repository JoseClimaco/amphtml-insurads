<!doctype html>
<html ⚡ lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InsurAds examples</title>
    <link rel="canonical" href="http://nonblocking.io/" />
    <meta
      name="viewport"
      content="width=device-width,minimum-scale=1,initial-scale=1"
    />
    <style amp-custom>
      amp-ad {
        max-width: 500px;
      }
      .red {
        background-color: red;
      }
      .talldiv {
        height: 2000px;
      }
      amp-ad div[placeholder] {
        background-color: lightgray;
      }
      amp-ad div[fallback] {
        background-color: black;
      }
      amp-ad div[placeholder]::after {
        content: 'loading ...';
      }
      amp-ad div[fallback]::after {
        content: 'No ad';
        color: white;
      }
      amp-ad div[placeholder]::after,
      amp-ad div[fallback]::after {
        font-size: 20px;
        line-height: 30px;
        text-align: center;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% - 15px);
      }
      amp-user-notification {
        background-color: lightgray;
        padding: 5px;
      }
    </style>
    <style amp-boilerplate>
      body {
        -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
        animation: -amp-start 8s steps(1, end) 0s 1 normal both;
      }
      @-webkit-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-moz-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-ms-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @-o-keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      @keyframes -amp-start {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
    </style>
    <noscript
      ><style amp-boilerplate>
        body {
          -webkit-animation: none;
          -moz-animation: none;
          -ms-animation: none;
          animation: none;
        }
      </style></noscript
    >
    <script async src="/dist/v0.js"></script>
    <script
      async
      custom-element="amp-ad"
      src="/dist/v0/amp-ad-0.1.js"
    ></script>
  </head>
  <body>
    <amp-user-notification layout="nodisplay" id="amp-user-notification">
      This site uses cookies to personalize content.
      <a href="#learn-more">Learn more.</a>
      <button on="tap:amp-user-notification.dismiss" tabindex="0">
        I accept
      </button>
    </amp-user-notification>

    <h2>Insurads</h2>
    <amp-ad width="300" height="250" type="insurads" data-public-id="4WMPI6PV" data-slot="/134642692/amp-samples/amp-MREC" json='{"targeting":{"target":["sample"],"pos":["amp"]}}'>
    </amp-ad>

</html>
