<!doctype html>
<html ⚡ lang="en">

<head>
  <meta charset="utf-8" />
  <title>InsurAds examples</title>
  <link rel="canonical" href="http://nonblocking.io/insurads.html" />
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1" />
  <style amp-custom>
    amp-ad {
      max-width: 500px;
    }

    .red {
      background-color: red;
    }

    .talldiv {
      height: 2000px;
    }

    amp-ad div[placeholder] {
      background-color: lightgray;
    }

    amp-ad div[fallback] {
      background-color: black;
    }

    amp-ad div[placeholder]::after {
      content: 'loading ...';
    }

    amp-ad div[fallback]::after {
      content: 'No ad';
      color: white;
    }

    amp-ad div[placeholder]::after,
    amp-ad div[fallback]::after {
      font-size: 20px;
      line-height: 30px;
      text-align: center;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% - 15px);
    }

    amp-user-notification {
      background-color: lightgray;
      padding: 5px;
    }
  </style>
  <noscript>
    <style amp-boilerplate>
      body {
        -webkit-animation: none;
        -moz-animation: none;
        -ms-animation: none;
        animation: none;
      }
    </style>
  </noscript>
  <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
  <script async src="https://cdn.ampproject.org/v0.js"></script>
</head>

<body>
