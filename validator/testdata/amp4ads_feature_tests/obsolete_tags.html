<!--
  Test Description:
  This tests that A4A does not allow obsolete non-conforming tags, which AMP
  does.
-->
<!doctype html>
<html ⚡4ads>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,minimum-scale=1" />
    <style amp4ads-boilerplate>
      body {
        visibility: hidden;
      }
    </style>
    <script async src="https://cdn.ampproject.org/amp4ads-v0.js"></script>
  </head>
  <body>
    These tags are not allowed:
    <acronym></acronym>
    <big></big>
    <center></center>
    <dir></dir>
    <hgroup></hgroup>
    <listing></listing>
    <multicol></multicol>
    <nextid></nextid>
    <nobr></nobr>
    <spacer></spacer>
    <strike></strike>
    <tt></tt>
    <xmp></xmp>
    <o:p></o:p>
  </body>
</html>
